name: module_sample
description: A new Flutter project.
publish_to: 'none'

# App Store / Xcode：name=1.0.0，number=1（CFBundleShortVersionString / CFBundleVersion）
version: 1.0.0+1

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  json_annotation: ^4.12.0
  get: ^4.7.3
  intl: any

  module_core:
    path: ./commons/core
  module_auth:
    path: ./features/auth
  module_chat:
    path: ./features/chat
  module_common_ui:
    path: ./commons/ui
  module_community:
    path: ./features/community
  module_friend:
    path: ./features/friend
  module_global_cache:
    path: ./commons/storage
  module_home:
    path: ./features/home
  module_ai:
    path: ./features/ai
  module_classroom:
    path: ./features/classroom
  module_http:
    path: ./commons/network
  module_live:
    path: ./features/live
  module_pay:
    path: ./features/pay
  wys_router:
    path: ./commons/wys_router
  module_settings:
    path: ./features/settings
  module_utils:
    path: ./commons/toolkit
  module_video:
    path: ./features/video
  module_bfui:
    path: ./features/bfui
  module_music:
    path: ./features/music
  module_linking:
    path: ./components/linking
  module_realtime:
    path: ./components/realtime
  module_rongcloud_im:
    path: ./components/rongcloud_im
  module_dokit_bootstrap:
    path: ./components/dokit_bootstrap

  # ---------------------------------------------------------------------------
  # wys_* 栈（与 module_* 并存；不含 fluttertoast / audioplayers_ohos 包）
  # wys_account 已废弃（ADR 0009），Session Owner 为 module_auth；包目录保留但未接线
  # ---------------------------------------------------------------------------
  wys_common:
    path: ./commons/wys_common
  wys_network:
    path: ./commons/wys_network
  wys_push:
    path: ./components/wys_push
  wys_face_verify:
    path: ./components/wys_face_verify
  wys_login_share_pay:
    path: ./components/wys_login_share_pay
  wys_chart:
    path: ./components/wys_chart

  # ---------------------------------------------------------------------------
  # OpenHarmony（Flutter 3.35）：已适配库放在 dependencies（git），不放 overrides。
  # 写法参考 CPF / openharmony-tpc README，只声明主包；*_ohos 由主包 path 带入。
  # 官方仓：CPF-Flutter、openharmony-tpc/flutter_packages
  # ---------------------------------------------------------------------------

  # flutter_packages（openharmony-tpc）
  image_picker:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/image_picker/image_picker
      ref: br_image_picker-v1.2.1_ohos
  path_provider:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: br_path_provider-v2.1.5_ohos
  shared_preferences:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/shared_preferences/shared_preferences
      ref: br_shared_preferences-v2.5.4_ohos
  # video_player OHOS 暂不接入：video_player_ohos → pigeon(git) 锁定旧 analyzer，
  # 与 json_serializable ^6.9 / json_annotation ^4.12 冲突。短视频仍用 pub.dev。

  # plus_plugins（CPF-Flutter）
  connectivity_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_plus_plugins.git
      path: packages/connectivity_plus/connectivity_plus
      ref: br_connectivity_plus-v6.1.0_ohos
  device_info_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_plus_plugins.git
      path: packages/device_info_plus/device_info_plus
      ref: br_device_info_plus-v12.3.0_ohos
  package_info_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_plus_plugins.git
      path: packages/package_info_plus/package_info_plus
      ref: br_package_info_plus-v9.0.0_ohos

  # 独立仓（CPF-Flutter）
  scan:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_scan.git
      ref: master
  permission_handler:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_permission_handler.git
      path: permission_handler
      ref: br_v12.0.1_ohos
  sqflite:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_sqflite.git
      path: sqflite
      ref: br_v2.4.2_ohos
  audioplayers:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_audioplayers.git
      path: packages/audioplayers
      ref: br_v6.5.1_ohos
  flutter_inappwebview:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_inappwebview.git
      path: flutter_inappwebview
      ref: br_v6.1.5_ohos
  wakelock_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_wakelock_plus.git
      path: wakelock_plus
      ref: br_v1.4.0_ohos

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/lotties/
    - assets/web/
    - commons/toolkit/assets/data/video_mock_sources.json

# 支付宝 tobias：iOS 回跳 scheme（禁止含 `_`；须与支付宝开放平台配置一致）
tobias:
  url_scheme: xiaomaoalipay

# 微信 fluwx：iOS URL Scheme / Universal Link（app_id 与 WysWechatConfig 对齐）
fluwx:
  app_id: wxd92d02603e1c59dc
  ios:
    # 正式环境请换成已备案的 Universal Link
    universal_link: https://example.com/app/

dependency_overrides:
  # 非鸿蒙钉选
  rxdart: ^0.27.7
  screen_brightness_ios: 2.1.2
  # ---------------------------------------------------------------------------
  # OHOS git 同源消解：features/commons 仍写 pub.dev 版本，pub 会与根
  # dependencies 的 git 源冲突。下列条目与 dependencies 完全一致，仅用于
  # 强制解析到鸿蒙适配源；权威声明仍在 dependencies。
  # ---------------------------------------------------------------------------
  image_picker:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/image_picker/image_picker
      ref: br_image_picker-v1.2.1_ohos
  path_provider:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: br_path_provider-v2.1.5_ohos
  shared_preferences:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/shared_preferences/shared_preferences
      ref: br_shared_preferences-v2.5.4_ohos
  connectivity_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_plus_plugins.git
      path: packages/connectivity_plus/connectivity_plus
      ref: br_connectivity_plus-v6.1.0_ohos
  device_info_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_plus_plugins.git
      path: packages/device_info_plus/device_info_plus
      ref: br_device_info_plus-v12.3.0_ohos
  package_info_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_plus_plugins.git
      path: packages/package_info_plus/package_info_plus
      ref: br_package_info_plus-v9.0.0_ohos
  scan:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_scan.git
      ref: master
  permission_handler:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_permission_handler.git
      path: permission_handler
      ref: br_v12.0.1_ohos
  sqflite:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_sqflite.git
      path: sqflite
      ref: br_v2.4.2_ohos
  audioplayers:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_audioplayers.git
      path: packages/audioplayers
      ref: br_v6.5.1_ohos
  flutter_inappwebview:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_inappwebview.git
      path: flutter_inappwebview
      ref: br_v6.1.5_ohos
  wakelock_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_wakelock_plus.git
      path: wakelock_plus
      ref: br_v1.4.0_ohos
