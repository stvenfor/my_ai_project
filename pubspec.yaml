name: module_sample
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  json_annotation: ^4.12.0
  get: ^4.7.3
  intl: any

  module_core:
    path: ./commons/core
  module_auth:
    path: ./features/auth
  module_chat:
    path: ./features/chat
  module_common_ui:
    path: ./commons/ui
  module_community:
    path: ./features/community
  module_friend:
    path: ./features/friend
  module_global_cache:
    path: ./commons/storage
  module_home:
    path: ./features/home
  module_classroom:
    path: ./features/classroom
  module_http:
    path: ./commons/network
  module_live:
    path: ./features/live
  module_pay:
    path: ./features/pay
  module_route:
    path: ./packages/route
  module_settings:
    path: ./features/settings
  module_utils:
    path: ./commons/toolkit
  module_video:
    path: ./features/video
  module_bfui:
    path: ./features/bfui
  module_music:
    path: ./features/music
  module_linking:
    path: ./packages/infrastructure/linking
  module_realtime:
    path: ./packages/infrastructure/realtime
  module_rongcloud_im:
    path: ./packages/infrastructure/rongcloud_im
  module_dokit_bootstrap:
    path: ./packages/infrastructure/dokit_bootstrap
  permission_handler_ohos:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_permission_handler.git
      path: permission_handler_ohos
      ref: br_v12.0.1_ohos

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/lotties/
    - assets/web/
    - commons/toolkit/assets/data/video_mock_sources.json

dependency_overrides:
  rxdart: ^0.27.7
  # Flutter 3.35.x iOS 嵌入层暂无 FlutterSceneLifeCycleDelegate，锁定 federated 实现版本。
  screen_brightness_ios: 2.1.2
  # OpenHarmony 适配：CPF-Flutter/flutter_packages
  image_picker:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      ref: br_image_picker-v1.1.2_ohos
      path: packages/image_picker/image_picker
  image_picker_ohos:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      ref: br_image_picker-v1.1.2_ohos
      path: packages/image_picker/image_picker_ohos
  scan:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_scan.git
      ref: master
  # audioplayers OHOS override 仅用于鸿蒙 Flutter SDK 构建，见 docs/flutter-example-apps-music-migration.md
