name: module_sample
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  json_annotation: ^4.12.0
  get: ^4.7.3
  intl: any

  module_core:
    path: ./packages/core
  module_auth:
    path: ./packages/features/auth
  module_chat:
    path: ./packages/features/chat
  module_common_ui:
    path: ./packages/ui
  module_community:
    path: ./packages/features/community
  module_friend:
    path: ./packages/features/friend
  module_global_cache:
    path: ./packages/storage
  module_home:
    path: ./packages/features/home
  module_http:
    path: ./packages/network
  module_live:
    path: ./packages/features/live
  module_pay:
    path: ./packages/features/pay
  module_route:
    path: ./packages/route
  module_settings:
    path: ./packages/features/settings
  module_utils:
    path: ./packages/toolkit
  module_supabase:
    path: ./packages/infrastructure/supabase
  module_video:
    path: ./packages/features/video

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/lotties/
    - assets/web/

dependency_overrides:
  rxdart: ^0.27.7
