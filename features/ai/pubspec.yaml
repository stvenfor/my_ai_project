name: module_ai
description: AI 小石头 — SSE 流式业务向导助手。
publish_to: 'none'
version: 0.0.1

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3
  module_common_ui:
    path: ../../commons/ui
  module_core:
    path: ../../commons/core
  module_http:
    path: ../../commons/network
  wys_router:
    path: ../../commons/wys_router
  module_auth:
    path: ../auth

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

# 与根工程一致：消解 module_utils 内 rxdart 冲突，便于包内单测。
dependency_overrides:
  rxdart: ^0.27.7

flutter:
  uses-material-design: true
