name: module_common_ui
description: Shared UI utilities for flutter_module_sample.
publish_to: 'none'
version: 0.0.1

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  bot_toast: ^4.1.3
  flutter_easyrefresh: ^2.2.2
  flutter_inappwebview: ^6.1.5
  get: ^4.7.3
  module_core:
    path: ../core
  module_utils:
    path: ../toolkit
  wys_router:
    path: ../wys_router

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Variable.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Variable.ttf
